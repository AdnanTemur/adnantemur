name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *" # runs daily at midnight
  workflow_dispatch: # allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Required for scripts/contribution_card.py to exist. The workflow had no
        # checkout before, because the snake action needs nothing from the repo.
        uses: actions/checkout@v4

      - name: Build the contribution card
        # Deliberately runs BEFORE the snake step. Platane/snk is a Docker action,
        # so it runs as root and leaves dist/ root-owned — a later step running as
        # `runner` then cannot write there, which showed up as the deeply
        # unhelpful "curl: (23) Failure writing output to destination". Creating
        # dist/ here first makes it runner-owned; root can still write into it.
        run: python3 scripts/contribution_card.py --user AdnanTemurBarcha --since 2019 --out dist

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: AdnanTemurBarcha
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Verify the published set
        # dist/ is about to replace the output branch wholesale. Publishing a
        # partial set would leave broken images on the profile, so check first.
        run: |
          set -e
          for f in contributions-dark.svg contributions-light.svg \
                   github-snake.svg github-snake-dark.svg; do
            test -s "dist/$f" || { echo "::error::dist/$f missing or empty"; exit 1; }
          done
          ls -la dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
